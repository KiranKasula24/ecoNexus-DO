services:
  # Next.js frontend
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      LANGGRAPH_AGENT_URL: http://agent:8001
    depends_on:
      - agent

  # Python AI backend
  agent:
    build:
      context: ./python/langgraph_agents
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env